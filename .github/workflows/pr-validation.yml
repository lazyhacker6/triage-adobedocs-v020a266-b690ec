---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Craft artifact
        run: |
          echo "true" > has-warnings.txt
          cp .github/poc/pr-number.txt pr-number.txt
          cat pr-number.txt

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
